<style>
  :root {
    --bg: #0b1220;
    --bg-glow: #1a2a44;
    --card: rgba(255, 255, 255, 0.06);
    --card-hover: rgba(255, 255, 255, 0.12);
    --border: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --muted: #a9b3c7;
    --accent: #e8743b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo {
    width: 96px; height: 96px; margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #c2410c);
    display: grid; place-items: center;
    font-size: 34px; font-weight: 800; letter-spacing: 1px;
    box-shadow: 0 10px 30px rgba(232, 116, 59, 0.35);
  }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0.3px; }
  .bio { margin: 0 auto 32px; max-width: 340px; color: var(--muted); font-size: 16px; line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 17px; font-weight: 600;
    transition: background 0.15s, transform 0.15s, border-color 0.15s;
  }
  a.link:hover, a.link:focus-visible { background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px); outline: none; }
  a.link svg { width: 26px; height: 26px; flex: none; }
  a.link span { flex: 1; text-align: left; }
  a.link .handle { flex: none; color: var(--muted); font-weight: 400; font-size: 14px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
